name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            bundles: nsis
          - os: windows-11-arm
            platform: win
            arch: arm64
            bundles: nsis
          - os: macos-15
            platform: mac
            arch: arm64
            bundles: app,dmg
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            bundles: deb
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            bundles: deb
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: echo "node=$(node scripts/toolchain.mjs node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.os }}-${{ matrix.arch }}
      - if: matrix.platform == 'linux'
        uses: ./.github/actions/install-linux-deps
      - name: Resolve the bundle directory
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          echo "dir=${CARGO_TARGET_DIR:-$PWD/src-tauri/target}/release/bundle" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run tauri:check
      - run: npm run build
      - name: Build Tauri bundles
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            image_arch=arm64
          else
            image_arch=x86_64
          fi
          bash scripts/build-appimage.sh \
            "${CARGO_TARGET_DIR:-$PWD/src-tauri/target}/release/hermes-iroh-app" \
            "$version" \
            "$image_arch" \
            "${{ steps.bundle.outputs.dir }}/appimage"
        env:
          APPIMAGETOOL_SHA256_X86_64: ${{ vars.APPIMAGETOOL_SHA256_X86_64 }}
          APPIMAGETOOL_SHA256_AARCH64: ${{ vars.APPIMAGETOOL_SHA256_AARCH64 }}
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node scripts/collect-release-assets.mjs \
            --input "${{ steps.bundle.outputs.dir }}" \
            --output release \
            --version "$version"
      - name: Enforce the installer size budget
        run: node scripts/check-installer-size.mjs --directory release
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  android:
    needs: verify
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "node=$(node scripts/toolchain.mjs node)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(node scripts/toolchain.mjs ndk)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install the Android SDK, build tools, and NDK
        shell: bash
        run: |
          set -euo pipefail
          eval "sdkmanager --install $(node scripts/toolchain.mjs sdkmanager)"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$(node scripts/toolchain.mjs ndk)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: android-arm64
      - run: npm ci
      - run: npm run tauri:check
      - name: Require the Android signing material
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Configure the release keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > src-tauri/gen/android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build the Android APK
        run: npx tauri android build --apk --target aarch64
      - name: Verify the APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          build_tools=$(node -p "require('./.toolchain.json').androidBuildTools[0]")
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --print-certs "$apk"
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node scripts/collect-release-assets.mjs \
            --input src-tauri/gen/android/app/build/outputs/apk \
            --output release \
            --version "$version"
      - name: Enforce the installer size budget
        run: node scripts/check-installer-size.mjs --directory release
      - name: Upload the Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-arm64
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read the pinned toolchain
        id: toolchain
        shell: bash
        run: echo "node=$(node scripts/toolchain.mjs node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Verify the exact asset set
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node scripts/verify-release-assets.mjs --directory release --version "$version"
      - name: Enforce the installer size budget
        run: node scripts/check-installer-size.mjs --directory release
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          files=(*.exe *.dmg *.zip *.AppImage *.deb *.apk)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          previous=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          {
            echo "## Changes"
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "${previous}..${tag}"
            else
              git log --no-merges --pretty='- %s' "${tag}"
            fi
          } > release/RELEASE_NOTES.md
          cat release/RELEASE_NOTES.md
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version=$(node -p "require('./package.json').version")
          node scripts/verify-release-assets.mjs --directory release --version "$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" = "true" ]; then
              echo "Reusing existing draft release $tag"
            else
              echo "Release $tag is already published; updating assets"
            fi
          else
            prerelease_args=()
            case "$tag" in
              *-*) prerelease_args=(--prerelease) ;;
            esac
            gh release create "$tag" --draft --verify-tag --notes-file release/RELEASE_NOTES.md "${prerelease_args[@]}"
          fi
          gh release upload "$tag" release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.apk release/SHA256SUMS.txt --clobber
          if [[ "$tag" == *-* ]]; then
            gh release edit "$tag" --draft=false --notes-file release/RELEASE_NOTES.md --prerelease
          else
            gh release edit "$tag" --draft=false --notes-file release/RELEASE_NOTES.md
          fi

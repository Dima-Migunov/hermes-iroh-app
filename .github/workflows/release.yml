name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            targets: nsis:x64
            native: "@number0/iroh-win32-x64-msvc"
          - os: windows-11-arm
            platform: win
            arch: arm64
            targets: nsis:arm64
            native: "@number0/iroh-win32-arm64-msvc"
          - os: macos-14
            platform: mac
            arch: arm64
            targets: dmg:arm64 zip:arm64
            native: "@number0/iroh-darwin-arm64"
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            targets: AppImage:x64 deb:x64
            native: "@number0/iroh-linux-x64-gnu"
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            targets: AppImage:arm64 deb:arm64
            native: "@number0/iroh-linux-arm64-gnu"
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies for ${{ matrix.arch }}
        run: npm ci --cpu=${{ matrix.arch }}
      - name: Verify native Iroh package
        shell: bash
        run: |
          package="node_modules/${{ matrix.native }}"
          if [ ! -d "$package" ]; then
            echo "::error::Expected native package ${{ matrix.native }} at $package"
            exit 1
          fi
      - run: npm run build
      - name: Package ${{ matrix.platform }}-${{ matrix.arch }}
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.targets }} --publish never
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Verify asset set
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local pattern="$1" expected="$2" actual
            actual=$(find release -maxdepth 1 -type f -name "$pattern" | wc -l | tr -d ' ')
            if [ "$actual" -ne "$expected" ]; then
              echo "::error::Expected $expected $pattern files, found $actual"
              exit 1
            fi
          }
          check '*.exe' 2
          check '*.dmg' 1
          check '*.zip' 1
          check '*.AppImage' 2
          check '*.deb' 2
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          files=(*.exe *.dmg *.zip *.AppImage *.deb)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" = "true" ]; then
              echo "Reusing existing draft release $tag"
            else
              echo "Release $tag is already published; updating assets"
            fi
          else
            prerelease_args=()
            case "$tag" in
              *-*) prerelease_args=(--prerelease) ;;
            esac
            gh release create "$tag" --draft --verify-tag --generate-notes "${prerelease_args[@]}"
          fi
          gh release upload "$tag" release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb release/SHA256SUMS.txt --clobber
          if [[ "$tag" == *-* ]]; then
            gh release edit "$tag" --draft=false --prerelease
          else
            gh release edit "$tag" --draft=false
          fi

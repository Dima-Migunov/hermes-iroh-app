name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - name: Verify tag and application version
        run: npm run tauri:check
      - run: npm run typecheck
      - run: npm test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  build:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            bundles: nsis
          - os: windows-11-arm
            platform: win
            arch: arm64
            bundles: nsis
          - os: macos-15
            platform: mac
            arch: arm64
            bundles: app,dmg
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            bundles: deb
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            bundles: deb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.os }}-${{ matrix.arch }}
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - run: npm ci
      - run: npm run tauri:sync
      - run: npm run tauri:check
      - run: npm run build
      - name: Build Tauri bundles
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            image_arch=arm64
          else
            image_arch=x86_64
          fi
          bash scripts/build-appimage.sh \
            src-tauri/target/release/hermes-iroh-app \
            "$version" \
            "$image_arch" \
            src-tauri/target/release/bundle/appimage
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node scripts/collect-release-assets.mjs \
            --input src-tauri/target/release/bundle \
            --output release \
            --version "$version"
      - name: Enforce the installer size budget
        run: node scripts/check-installer-size.mjs --directory release
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  android:
    needs: verify
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install the Android SDK, build tools, and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: android-arm64
      - run: npm ci
      - run: npm run tauri:sync
      - run: npm run tauri:check
      - name: Require the Android signing material
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Configure the release keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > src-tauri/gen/android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build the Android APK
        run: npx tauri android build --apk --target aarch64
      - name: Verify the APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          node scripts/collect-release-assets.mjs \
            --input src-tauri/gen/android/app/build/outputs/apk \
            --output release \
            --version "$version"
      - name: Enforce the installer size budget
        run: node scripts/check-installer-size.mjs --directory release
      - name: Upload the Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-arm64
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Verify asset set
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local pattern="$1" expected="$2" actual
            actual=$(find release -maxdepth 1 -type f -name "$pattern" | wc -l | tr -d ' ')
            if [ "$actual" -ne "$expected" ]; then
              echo "::error::Expected $expected $pattern files, found $actual"
              exit 1
            fi
          }
          check '*.exe' 2
          check '*.dmg' 1
          check '*.zip' 1
          check '*.AppImage' 2
          check '*.deb' 2
          check '*.apk' 1
      - name: Enforce the installer size budget
        run: node scripts/check-installer-size.mjs --directory release
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          files=(*.exe *.dmg *.zip *.AppImage *.deb *.apk)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          previous=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          {
            echo "## Changes"
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "${previous}..${tag}"
            else
              git log --no-merges --pretty='- %s' "${tag}"
            fi
          } > release/RELEASE_NOTES.md
          cat release/RELEASE_NOTES.md
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" = "true" ]; then
              echo "Reusing existing draft release $tag"
            else
              echo "Release $tag is already published; updating assets"
            fi
          else
            prerelease_args=()
            case "$tag" in
              *-*) prerelease_args=(--prerelease) ;;
            esac
            gh release create "$tag" --draft --verify-tag --notes-file release/RELEASE_NOTES.md "${prerelease_args[@]}"
          fi
          gh release upload "$tag" release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.apk release/SHA256SUMS.txt --clobber
          if [[ "$tag" == *-* ]]; then
            gh release edit "$tag" --draft=false --notes-file release/RELEASE_NOTES.md --prerelease
          else
            gh release edit "$tag" --draft=false --notes-file release/RELEASE_NOTES.md
          fi

name: Install Linux build dependencies
description: Installs the WebKitGTK 4.1 and Tauri build packages needed on Linux runners.

runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          curl \
          file \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          patchelf \
          wget

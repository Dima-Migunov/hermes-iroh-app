appId: com.number0.hermes-iroh-app
productName: Hermes Iroh App
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  - node_modules/**

asar: true
asarUnpack:
  - node_modules/@number0/iroh/**
  - node_modules/@number0/iroh-*/**

npmRebuild: false

artifactName: ${name}-${version}-${os}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

linux:
  category: Network
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64

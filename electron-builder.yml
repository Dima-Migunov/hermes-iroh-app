appId: com.number0.hermes-iroh-app
productName: Hermes Iroh App
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  - node_modules/**

extraResources:
  - from: build/com.number0.hermes-iroh-app.metainfo.xml
    to: com.number0.hermes-iroh-app.metainfo.xml

asar: true
asarUnpack:
  - node_modules/@number0/iroh/**
  - node_modules/@number0/iroh-*/**

npmRebuild: false

artifactName: ${name}-${version}-${os}-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

linux:
  icon: build/icons
  category: Network
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64

deb:
  afterInstall: build/deb-after-install.sh
  afterRemove: build/deb-after-remove.sh

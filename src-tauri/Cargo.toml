[package]
name = "hermes-iroh-app"
version = "0.8.0"
description = "Desktop client for the Hermes Agent Iroh-channel plugin"
authors = ["Hermes Iroh App Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lib]
name = "hermes_iroh_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
url = "2"
regex = "1"
iroh = "=1.5.0"
iroh-tickets = "=1.0.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
